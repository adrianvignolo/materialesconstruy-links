<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiales ConstruY | Enlaces Oficiales</title>
  
  <!-- Metadatos de SEO y Navegación -->
  <meta name="description" content="Página oficial de enlaces de Materiales ConstruY, C.A. Fabricantes de pintura de caucho lavable y esmalte semi-industrial. Tienda online, catálogo, carta de colores y pedidos por WhatsApp.">
  <meta name="keywords" content="Materiales ConstruY, Pinturas ConstruY, pintura de caucho, esmalte semi-industrial, catalogo, carta de colores, Caracas, ferreteria, pinturas Venezuela">
  <meta name="author" content="Materiales ConstruY, C.A.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://links.materialesconstruy.com/">
  
  <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Materiales ConstruY">
  <meta property="og:url" content="https://links.materialesconstruy.com/">
  <meta property="og:title" content="Materiales ConstruY | Enlaces Oficiales & Catálogo">
  <meta property="og:description" content="Tu espacio en 15 colores. Pintura de caucho y esmalte semi-industrial Clase A. Tienda online, pedidos por WhatsApp y programa de lealtad.">
  <meta property="og:image" content="https://links.materialesconstruy.com/assets/og-banner.jpg">
  <meta property="og:image:secure_url" content="https://links.materialesconstruy.com/assets/og-banner.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Carta de Colores Clase A - Materiales ConstruY">
  <meta property="og:locale" content="es_VE">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://links.materialesconstruy.com/">
  <meta name="twitter:title" content="Materiales ConstruY | Enlaces Oficiales & Catálogo">
  <meta name="twitter:description" content="Tu espacio en 15 colores. Pintura de caucho y esmalte semi-industrial Clase A. Tienda online, pedidos por WhatsApp y programa de lealtad.">
  <meta name="twitter:image" content="https://links.materialesconstruy.com/assets/og-banner.jpg">
  <meta name="twitter:image:alt" content="Carta de Colores Clase A - Materiales ConstruY">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="assets/logo-avatar.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fondo plano -->
  <div class="bg-grid-pattern" aria-hidden="true"></div>

  <main class="linktree-container">
    
    <!-- Barra superior de utilidades (Compartir) -->
    <header class="header-actions">
      <button id="btn-share" class="action-pill-btn" aria-label="Compartir perfil de enlaces" title="Compartir">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span>Compartir</span>
      </button>
    </header>

    <!-- Perfil de Marca -->
    <section class="brand-profile">
      <!-- Avatar con borde y badge verificado -->
      <div class="avatar-wrapper">
        <img id="profile-avatar" src="assets/logo-avatar.png" alt="Logo de Materiales ConstruY" class="avatar-img" width="108" height="108">
        <div class="verified-badge" title="Cuenta Oficial Verificada">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Nombre -->
      <h1 id="profile-name" class="brand-title">Materiales ConstruY</h1>
    </section>

    <!-- Barra de Redes Sociales y Contacto Rápido (Controlada por config.js) -->
    <nav id="social-bar-container" class="social-buttons-bar" aria-label="Redes Sociales y Canales Oficiales">
      <!-- Se genera dinámicamente desde js/config.js -->
    </nav>

    <!-- Lista de Enlaces Principales (Estilo Linktree - Controlada por config.js) -->
    <section id="links-container" class="links-section" aria-label="Enlaces Principales">
      <!-- Se generan dinámicamente desde js/config.js -->
    </section>



  </main>

  <!-- Scripts: Configuración de enlaces, analítica e interacciones -->
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
